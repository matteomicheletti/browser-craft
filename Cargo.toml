[package]
name = "browsecraft"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3", default-features = false }
egui = "0.36.2"
egui-phosphor = "0.14.0"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
egui-winit = "0.36.2"
fontdue = "0.9"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pollster = "1.0.1"
softbuffer = "0.4"
tempfile = "3"
ureq = "3"
url = "2"
keepass = { version = "0.8", default-features = false, features = ["save_kdbx4"] }
argon2 = { package = "rust-argon2", version = "3" }
secstr = "0.5"
zeroize = "1"
base64 = "0.22"
winit = "0.30"
wry = { version = "0.55", features = ["devtools"] }
psl = "2"
# Shared by the fork's modules (settings, plugin manifests, automation API).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Release builds abort on panic, so production code may not unwrap or
# expect; the few proven invariants say why in an `allow` attribute. Tests
# may (clippy.toml). Enforced by `cargo clippy` in CI.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
# Experimental (issue #65): render web pages with Servo on Linux, where there
# is no system web view. Off by default; other platforms ignore it.
servo = ["dep:servo", "dep:rustls"]

[target.'cfg(target_os = "linux")'.dependencies]
# `webcrypto` provides `crypto.getRandomValues()` and `crypto.subtle`, which
# many sites need at start-up (see docs/servo-compat.md).
servo = { version = "0.7", optional = true, features = ["webcrypto"] }
# Servo's graph enables two rustls crypto providers, so the process has to
# install one itself.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
# wry renders web pages with WebKitGTK on Linux; GTK must be initialised and
# its main context pumped from the winit loop (see docs/ARCHITECTURE_DECISION.md).
gtk = "0.18"
# Already in the tree through wry (same version and feature): the WebKitGTK
# API wry does not wrap (find in page, page snapshots, the inspector window,
# favicons).
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_Security_Authorization"] }

[dev-dependencies]
flate2 = "1"

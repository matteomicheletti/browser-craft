[package]
name = "browsecraft"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
egui-winit = "0.36.2"
fontdue = "0.9"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pollster = "1.0.1"
softbuffer = "0.4"
tempfile = "3"
ureq = "3"
url = "2"
keepass = { version = "0.8", default-features = false, features = ["save_kdbx4"] }
argon2 = { package = "rust-argon2", version = "3" }
secstr = "0.5"
zeroize = "1"
base64 = "0.22"
winit = "0.30"
wry = { version = "0.55", features = ["devtools"] }
psl = "2"
# Shared by the fork's modules (settings, plugin manifests, automation API).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Dark mode URL rules (src/darkmode/settings.rs); already in the lock graph.
regex = "1"
# Interpreter for untrusted plugin logic (feature `wasm`): pure Rust, no JIT.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate"], optional = true }
# Authenticator (src/authenticator): HMAC-SHA1/256/512 for HOTP/TOTP, the
# vault's XChaCha20-Poly1305, QR decoding, and scrypt + AES-256-GCM to read
# encrypted Aegis backups. All RustCrypto, already in the lock graph.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
rqrr = { version = "0.11.0", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
scrypt = { version = "0.12.0", default-features = false }
# Persistent history (history.sqlite) and reading the places.sqlite /
# History databases of Firefox and Chromium when importing. `bundled`
# compiles SQLite into the binary (no system libsqlite3 at run time, the same
# SQLite on every platform); already in the lock graph through servo-storage.
rusqlite = { version = "0.38", features = ["bundled"] }

# Release builds abort on panic, so production code may not unwrap or
# expect; the few proven invariants say why in an `allow` attribute. Tests
# may (clippy.toml). Enforced by `cargo clippy` in CI.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
# Experimental (issue #65): render web pages with Servo on Linux, where there
# is no system web view. Off by default; other platforms ignore it.
servo = ["dep:servo", "dep:rustls"]
# Sandboxed (interpreted, pure Rust) WASM plugin modules; see docs/EXTENSIONS.md.
default = ["wasm"]
wasm = ["dep:wasmi"]

[target.'cfg(target_os = "linux")'.dependencies]
# `webcrypto` provides `crypto.getRandomValues()` and `crypto.subtle`, which
# many sites need at start-up (see docs/servo-compat.md).
servo = { version = "0.7", optional = true, features = ["webcrypto"] }
# Servo's graph enables two rustls crypto providers, so the process has to
# install one itself.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
# wry renders web pages with WebKitGTK on Linux; GTK must be initialised and
# its main context pumped from the winit loop (see docs/ARCHITECTURE_DECISION.md).
gtk = "0.18"
# The headless mode drives WebKitGTK directly (offscreen window, snapshots,
# printing to PDF); same versions and features wry already pulls in.
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = { version = "=1.1.2", features = ["v2_28"] }
# Moves a tab's web view (wry's X11 container) between browser windows and
# raises the hover card above the web views (XReparentWindow, XRaiseWindow);
# already in the graph through wry, loaded at run time like there.
x11-dl = "2.21"

[target.'cfg(unix)'.dependencies]
# Peer credentials (SO_PEERCRED / getpeereid) of control socket clients.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Edit menu and the page key monitor (src/macos_menu.rs), the
# clipboard watcher (src/plugins/clipboard_watch_macos.rs), page pictures
# and the hover card (src/macos_web.rs); same versions wry already pulls in.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_Security_Authorization"] }

[dev-dependencies]
flate2 = "1"
# Assembles the WASM test modules from text.
wat = "1"
qrcode = { version = "0.14.1", default-features = false }
